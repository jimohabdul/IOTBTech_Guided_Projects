---
- name: Configure EC2 Instance with Docker
  hosts: webserver
  become: yes

  tasks:
    - name: Purge all invalid docker repository sources and clean apt cache
      shell: |
        rm -f /etc/apt/sources.list.d/*docker*
        rm -f /etc/apt/sources.list.d/*noble*
        apt-get clean
        rm -rf /var/lib/apt/lists/*

    - name: Ensure keyrings directory exists
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Docker GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Add Docker APT repository (Jammy)
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu jammy stable"
        state: present
        filename: docker

    - name: Force update apt repository cache
      apt:
        update_cache: yes
        force_apt_get: yes

    - name: Install Docker Engine and CLI
      apt:
        pkg:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Ensure Docker service is started and enabled
      service:
        name: docker
        state: started
        enabled: yes

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Run Docker test container to verify setup
      command: docker run --rm hello-world
      register: docker_test_result

    - name: Display Docker test output
      debug:
        msg: "{{ docker_test_result.stdout_lines }}"
