services:
  backend:
    image: zeetafin-backend:latest
    ports:
      - "3001:3000"
    environment:
      - PORT=3000
      - DB_HOST=host.docker.internal
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=zeetafin

frontend:
    image: zeetafin-frontend:latest
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:3001/api
    depends_on:
      - backend
