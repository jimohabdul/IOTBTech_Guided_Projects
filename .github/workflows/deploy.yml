name: ZeetaFin CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Without Submodules
      uses: actions/checkout@v4
      with:
        submodules: false
        fetch-depth: 1

    - name: Purge Submodule Metadata
      run: |
        rm -rf .gitmodules
        git rm --cached "Phase 2 - Containerization and Amazon ECR Deployment/ZeetaFin-BE" || true
        git rm --cached "Phase 2 - Containerization and Amazon ECR Deployment/ZeetaFin-FE" || true

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Log in to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build Docker Image
      run: |
        docker build -t zeetafin-app -f "Phase 2 - Containerization and Amazon ECR Deployment/ZeetaFin-BE/Dockerfile" "Phase 2 - Containerization and Amazon ECR Deployment/ZeetaFin-BE"
